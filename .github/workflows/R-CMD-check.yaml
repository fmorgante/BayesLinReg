name: R-CMD-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (Eigen BLAS ${{ matrix.config.eigen_blas }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, eigen_blas: "no"}
          - {os: ubuntu-latest, eigen_blas: "yes"}
          - {os: windows-latest, eigen_blas: "no"}
          - {os: windows-latest, eigen_blas: "yes"}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      BAYESLINREG_USE_EIGEN_BLAS: ${{ matrix.config.eigen_blas }}
      BAYESLINREG_EXPECT_EIGEN_BLAS: ${{ matrix.config.eigen_blas }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
